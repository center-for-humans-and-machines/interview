variables:
  APP_NAME: simple-chat-backend
  CHILD_PIPELINE_EXECUTION_CONTEXT: backend
  DEPLOYMENT_VARS: "MONGO_URL, MONGO_OPLOG_URL, DATABASE_NAME, OPEN_AI_BASE_URL, GWDG_BASE_URL, GWDG_API_KEY, GWDG_DEFAULT_MODEL, OPEN_AI_API_KEY, OPEN_AI_DEFAULT_MODEL,OPEN_AI_BASE_URL,S3_ENDPOINT,S3_ACCESS_KEY,S3_SECRET_KEY,S3_BUCKET_NAME,OPEN_AI_BACKEND,DEEPSEEK_URL,DEEPSEEK_KEY"
  # MONGO_URL defined in deploy-pipeline
  # API_KEY passed as GitLab CI/CD variable
  DATABASE_NAME: simple-chat-backend
  WEB_PORT: 8000
  NAMESPACE: simple-chat

include:
  - project: "mpib/chm/common/deploy-pipeline"
    ref: "2.1.10"
    file: "python-app.yml"
